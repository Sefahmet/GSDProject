<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>LBS 2023</title>

	<!-- improve accessibility on mobile phones -->
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- set the icon displayed on the tab of the webpage -->
	<link rel="shortcut icon" type="image/x-icon" href="https://www.geoinfo.uni-bonn.de/favicon.ico">

	<!-- import font 'Fira' -->
	<link rel="stylesheet" href="https://code.cdn.mozilla.net/fonts/fira.css">

	<!-- import jQuery -->
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

	<!-- import OpenLayers -->
	<link rel="stylesheet"
		href="https://cdn.jsdelivr.net/gh/openlayers/openlayers.github.io@master/en/v6.9.0/css/ol.css" type="text/css">
	<script src="https://cdn.jsdelivr.net/gh/openlayers/openlayers.github.io@master/en/v6.9.0/build/ol.js"></script>

	<!-- own script -->
	<script src="js/script.js" defer></script>
	<link rel="stylesheet" href="js/styles.css">

	<!-- proj4 für die Projektionen -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.3.12/proj4.js" type="text/javascript"></script>

	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			height: 100%;
		}

		.wrapper {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 10px;
		}

		.box {
			flex: 1;
		}

		.boxLeft {
			font-family: Calibri;
		}

		.container {
			height: calc(100% - 50px);
			width: 100%;
			position: relative;
		}

		.map {
			height: 100%;
			width: 100%;
		}

		.buttons {
			position: absolute;
			top: 10px;
			right: 10px;
			padding: 10px;
			background-color: rgb(251, 187, 0);
			box-shadow: 0 2px 5px rgba(10, 85, 161, 1);
		}

		.buttons label,
		.buttons input,
		.buttons button {
			margin-bottom: 5px;
			background-color: rgb(251, 187, 0);
			color: #0a55a1;
		}
	</style>

	<script>
		function findShortestPath() {
			// Add your code to find the shortest path here
			alert("Finding the shortest path...");
		}

		function toggleForm() {
			var form = document.getElementById("formSection");
			form.style.display = form.style.display === "none" ? "block" : "none";
		}
	</script>
</head>

<body>
	<div class="wrapper">
		<div class="box boxLeft">
			<b style="font-family: Arial; color: #fbbb00;">
				<br>
				Effortless Path for Bicycle  <br>
				Master Project - GSD <br>
				University of Bonn
			</b>
		</div>
	<!--	<div class="box boxRight">
			<a href="#"> <img id="logo" src="https://www.geoinfo.uni-bonn.de/favicon.ico"></a>
		</div>-->
	</div>

	<div class="slidecontainer">
		<p>Distance</p>
		<input type="range" min="0" max="4" value="1" class="slider" id="distanceRange">

		<p>Slope</p>
		<input type="range" min="0" max="4" value="1" class="slider" id="slopeRange">

		<p>Max Speed</p>
		<input type="range" min="0" max="4" value="1" class="slider" id="speedRange">

		<p>Turning Cost</p>
		<input type="range" min="0" max="4" value="1" class="slider" id="turningCostRange">

		<p>Greenary</p>
		<input type="range" min="0" max="4" value="1" class="slider" id="greenaryRange">

	</div>
	<div class="container">
		<!-- this element will be filled with the map in 'js/main.js' -->
		<div id="map" class="map"></div>
		<div class="buttons">
			<button onclick="toggleForm()">Navigate</button>
			<div id="formSection" style="display: none;">
				<form>
					<label for="coord1">Starting Location:</label>
					<input type="text" id="coord1">
					<br>
					<label for="coord2">Destination:</label>
					<input type="text" id="coord2">
					<br>
					<button type="button" onclick="findShortestPath()">Find Path</button>
				</form>
			</div>
		</div>
	</div>

</body>

</html>
